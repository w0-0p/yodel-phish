name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Extension

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scan public source boundary
        run: npm run scan

      - name: Download and verify model assets
        run: npm run models:download

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Chromium for integration tests
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        run: npm run test:integration

      - name: Build and package extension
        run: npm run package

      - name: Upload verified extension ZIP
        uses: actions/upload-artifact@v7
        with:
          name: yodel-phish-${{ github.sha }}
          path: |
            build/yodel-phish-0.1.0.zip
            build/yodel-phish-0.1.0.zip.SOURCE.txt
          if-no-files-found: error
          retention-days: 14
